<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151721">
  <title>更新夜泊</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/account.css">
  <script type="module" src="/update.js"></script>
</head>
<body data-auth="signed-out">
  <main class="auth-screen">
    <section class="auth-card" aria-labelledby="update-title">
      <div class="auth-brand"><span aria-hidden="true">☾</span><span>夜泊<small>NIGHT HARBOR</small></span></div>
      <h1 id="update-title">把新的小日常帶過來。</h1>
      <p class="auth-intro" id="update-status" role="status">正在檢查程式更新…</p>
      <p class="auth-note">更新會保留帳號資料與此裝置尚未同步的暫存。</p>
      <button class="button" type="button" id="retry-update" hidden>重新檢查更新</button>
      <p class="auth-note"><a href="/#social" id="open-app" hidden>已完成更新，開啟好友功能</a></p>
    </section>
  </main>
</body>
</html>
